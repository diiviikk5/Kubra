<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">
  <title>Stop Digging Through Dashboards</title>
  <script>
    document.documentElement.classList.add('motion-pending');
    var fallbackTimeout = setTimeout(function() {
      document.documentElement.classList.remove('motion-pending');
    }, 3500);
  </script>
  <style>
    /* Reset & Base Variables */
    :root {
      font-family: "Reference Sans", Arial, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color-scheme: dark;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000000;
      color: #ffffff;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      user-select: none;
    }

    /* Fixed Viewport */
    .viewport {
      position: fixed;
      inset: 0;
      isolation: isolate;
      background: #000000;
      overflow: hidden;
    }

    .screen {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 100%;
      height: 100%;
      background: #000000;
      overflow: hidden;

      /* Desktop Tokens */
      --gutter-start: clamp(36px, 4.177vw, 96px);
      --gutter-end: clamp(36px, 4.04vw, 96px);
      --header-top: clamp(20px, 2.264vh, 30px);
      --hero-bottom: clamp(34px, 5.19vh, 64px);
      --display-size: clamp(58px, 7.64vh, 88px);
      --display-leading: clamp(72px, 9.34vh, 106px);
      --copy-size: clamp(14px, 1.70vh, 19px);
      --copy-leading: clamp(19px, 2.17vh, 24px);
      --title-copy-gap: clamp(15px, 2.08vh, 24px);
      --copy-cta-gap: clamp(24px, 3.11vh, 36px);
      --cta-width: clamp(142px, 15.09vh, 168px);
      --cta-height: clamp(38px, 3.96vh, 44px);
      --compact-control-font-size: clamp(17px, 1.75vh, 19px);
      --action-control-font-size: clamp(17px, 1.78vh, 19.5px);
      --primary-control-font-size: clamp(17px, 1.77vh, 19.25px);
      --control-inline-nudge: -1px;
      --control-baseline-shift: clamp(1px, .19vh, 2px);
      --copy-optical-shift: clamp(0px, .1vh, 1px);
      --watch-baseline-shift: clamp(2px, .38vh, 4px);
      --card-width: clamp(150px, 18.96vh, 215px);
    }

    /* Full-Bleed Video Background */
    .background {
      position: absolute;
      inset: 0;
      z-index: -3;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      pointer-events: none;
      user-select: none;
    }

    /* Screen Vignette */
    .screen::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -2;
      pointer-events: none;
      background:
        linear-gradient(180deg, rgba(0,0,0,.03), transparent 24%, transparent 82%, rgba(0,0,0,.05)),
        radial-gradient(ellipse at 44% 54%, transparent 30%, rgba(0,0,0,.055) 100%);
    }

    /* Header Bar */
    .header {
      position: absolute;
      top: var(--header-top);
      left: var(--gutter-start);
      right: var(--gutter-end);
      height: 48px;
      display: flex;
      align-items: flex-start;
      white-space: nowrap;
      z-index: 10;
    }

    /* Brand 25x25 SVG Disc Logo */
    .brand {
      position: relative;
      top: 10px;
      width: 25px;
      height: 25px;
      display: inline-block;
      text-decoration: none;
      filter: drop-shadow(0 1px 2px rgba(0,0,0,.3));
      cursor: pointer;
    }

    .brand svg {
      width: 25px;
      height: 25px;
      display: block;
    }

    .header-actions {
      display: flex;
      align-items: flex-start;
      flex: 1;
    }

    /* Navigation Links */
    .nav {
      display: flex;
      align-items: flex-start;
      margin-left: clamp(36px, 3.03vw, 48px);
      gap: clamp(32px, 2.9vw, 43px);
      position: relative;
      top: 9px;
      list-style: none;
    }

    .nav a {
      font-size: 16px;
      font-weight: 430;
      letter-spacing: -0.36px;
      color: rgba(229, 229, 230, 0.77);
      text-shadow: 0 1px 3px rgba(0,0,0,.55);
      text-decoration: none;
      position: relative;
      display: inline-block;
      transition: color 140ms ease, opacity 140ms ease;
    }

    .nav a:hover {
      color: #ffffff;
      filter: brightness(1.08);
    }

    .nav li:first-child a {
      position: relative;
      top: -3px;
      color: #ffffff;
    }

    .nav li:first-child a::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: -4px;
      width: 44px;
      height: 2px;
      background: rgba(255, 255, 255, 0.82);
    }

    .nav li:nth-child(4) {
      margin-left: 1px;
    }

    /* Time Panel */
    .time-panel {
      margin-left: auto;
      width: 211px;
      height: 48px;
      padding-left: 8px;
      border-left: 2px solid rgba(230, 230, 230, 0.52);
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .time-panel__label {
      font-size: 15px;
      font-weight: 420;
      color: rgba(240, 240, 240, 0.77);
      line-height: 1.15;
    }

    .time-panel__value {
      font-size: 15px;
      font-weight: 440;
      color: rgba(255, 255, 255, 0.93);
      line-height: 1.15;
      margin-top: 1px;
    }

    /* Header Sign Up Pill Button */
    .sign-up {
      width: 109px;
      height: 42px;
      border-radius: 7px;
      background: #ffffff;
      color: #101010;
      font-size: 15px;
      font-weight: 460;
      letter-spacing: -0.34px;
      border: none;
      cursor: pointer;
      margin-left: clamp(20px, 1.95vw, 29px);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.72), 0 1px 5px rgba(0,0,0,.34);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: filter 140ms ease, transform 140ms ease;
    }

    .sign-up:hover {
      filter: brightness(1.08);
      transform: scale(1.01);
    }

    /* Menu Toggle (Mobile/Tablet only) */
    .menu-toggle {
      display: none;
      width: 46px;
      height: 46px;
      border-radius: 11px;
      border: 1px solid rgba(255,255,255,.21);
      background: linear-gradient(145deg, rgba(24,22,20,.80), rgba(5,12,14,.86));
      backdrop-filter: blur(14px) saturate(108%);
      cursor: pointer;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 5px;
      margin-left: auto;
    }

    .menu-toggle span {
      display: block;
      width: 18px;
      height: 2px;
      background: #ffffff;
      border-radius: 2px;
      transition: transform 0.25s ease, opacity 0.25s ease;
    }

    /* Hero Section */
    .hero-content {
      position: absolute;
      left: var(--gutter-start);
      bottom: var(--hero-bottom);
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      z-index: 5;
    }

    /* Hero Headline */
    .hero-title {
      font-family: "Reference Display", "Reference Sans", Arial, sans-serif;
      font-weight: 500;
      font-size: var(--display-size);
      line-height: var(--display-leading);
      font-optical-sizing: auto;
      letter-spacing: -2.1px;
      -webkit-text-stroke: 0.12px currentColor;
      white-space: nowrap;
      text-shadow: 0 2px 2px rgba(0,0,0,.44);
      display: flex;
      flex-direction: column;
      margin: 0;
    }

    .hero-title .line {
      display: block;
      overflow: hidden;
      transform-origin: left center;
    }

    .hero-title .line-one {
      color: #ffffff;
      transform: scaleX(0.775);
    }

    .hero-title .line-two {
      color: rgba(211, 207, 207, 0.78);
      transform: scaleX(0.793);
    }

    .hero-title .line-reveal {
      display: inline-block;
      will-change: transform;
    }

    /* Hero Body Copy */
    .hero-copy {
      font-size: var(--copy-size);
      line-height: var(--copy-leading);
      font-weight: 350;
      letter-spacing: 0.13px;
      color: rgba(226, 229, 228, 0.84);
      width: clamp(390px, 31.67vw, 500px);
      position: relative;
      left: 1px;
      text-shadow: 0 1px 3px rgba(0,0,0,.7);
      margin-top: var(--title-copy-gap);
      margin-bottom: var(--copy-cta-gap);
    }

    /* Primary White CTA Button */
    .primary-cta {
      position: relative;
      width: var(--cta-width);
      height: var(--cta-height);
      border-radius: 7px;
      background: #ffffff;
      color: #111111;
      border: none;
      cursor: pointer;
      box-shadow: 0 1px 5px rgba(0,0,0,.38);
      display: flex;
      align-items: center;
      text-decoration: none;
      transition: filter 140ms ease, transform 140ms ease;
    }

    .primary-cta:hover {
      filter: brightness(1.08);
      transform: scale(1.01);
    }

    .primary-cta .label {
      position: absolute;
      left: 8.125%;
      font-size: var(--primary-control-font-size);
      font-weight: 450;
      letter-spacing: -0.3px;
      color: #111111;
      white-space: nowrap;
    }

    .primary-cta .arrow-box {
      position: absolute;
      right: 3.125%;
      top: 14.286%;
      width: 20.625%;
      height: 71.429%;
      border-radius: 7px;
      background: #070909;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .primary-cta .arrow-box svg {
      width: 14px;
      height: 14px;
      stroke: #ffffff;
      stroke-width: 2;
      fill: none;
    }

    /* Demo Card (Bottom-Right Glass) */
    .demo-card {
      position: absolute;
      right: var(--gutter-end);
      bottom: var(--hero-bottom);
      width: var(--card-width);
      aspect-ratio: 201 / 265;
      container-type: inline-size;
      z-index: 5;

      border: 1px solid rgba(255,255,255,.13);
      border-radius: clamp(12px, 1.52vh, 18px);
      background: linear-gradient(145deg, rgba(24,22,20,.80), rgba(5,12,14,.86));
      box-shadow:
        0 2px 10px rgba(0,0,0,.44),
        0 0 0 3px rgba(255,255,255,.035) inset,
        0 0 0 1px rgba(0,0,0,.9);
      backdrop-filter: blur(14px) saturate(108%);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 3.5cqw;
    }

    .demo-visual {
      position: relative;
      width: 93cqw;
      height: 92cqw;
      border-radius: 4cqw;
      background: #101a1e;
      overflow: hidden;
      margin: 0 auto;
    }

    .demo-visual img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: brightness(0.89) saturate(0.93) contrast(1.03);
      display: block;
    }

    .demo-visual .play-btn {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 29cqw;
      height: 29cqw;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,.34);
      background: rgba(3,5,7,.47);
      backdrop-filter: blur(4px);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 140ms ease, filter 140ms ease;
    }

    .demo-visual .play-btn:hover {
      transform: translate(-50%, -50%) scale(1.06);
      filter: brightness(1.15);
    }

    .demo-visual .play-btn svg {
      width: 40%;
      height: 40%;
      fill: #ffffff;
      margin-left: 2px;
    }

    .watch-button {
      width: 100%;
      height: 38cqw;
      border-radius: 3.5cqw;
      background: linear-gradient(145deg, rgba(26,34,36,.86), rgba(16,29,33,.9));
      border: 1px solid rgba(255,255,255,.21);
      color: #ffffff;
      font-size: 13cqw;
      font-weight: 430;
      letter-spacing: -0.2px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: filter 140ms ease;
      text-shadow: 0 1px 2px rgba(0,0,0,.6);
    }

    .watch-button:hover {
      filter: brightness(1.12);
    }

    /* ENTRANCE MOTION CHOREOGRAPHY */
    @keyframes entrance-brand {
      from {
        opacity: 0;
        transform: translateY(7px) scale(0.94);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes entrance-nav {
      from {
        opacity: 0;
        transform: translateY(6px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes entrance-action {
      from {
        opacity: 0;
        transform: translateY(8px) scale(0.985);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes entrance-line {
      from {
        transform: translate3d(0, 110%, 0) skewY(2deg);
      }
      to {
        transform: translate3d(0, 0, 0) skewY(0deg);
      }
    }

    @keyframes entrance-copy {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes entrance-card {
      from {
        opacity: 0;
        transform: translateY(12px) scale(0.968);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* Motion Pending Styles */
    html.motion-pending .brand {
      animation: entrance-brand 580ms cubic-bezier(.16,1,.3,1) 60ms both;
    }

    html.motion-pending .nav li:nth-child(1) a { animation: entrance-nav 480ms cubic-bezier(.16,1,.3,1) 130ms both; }
    html.motion-pending .nav li:nth-child(2) a { animation: entrance-nav 480ms cubic-bezier(.16,1,.3,1) 175ms both; }
    html.motion-pending .nav li:nth-child(3) a { animation: entrance-nav 480ms cubic-bezier(.16,1,.3,1) 220ms both; }
    html.motion-pending .nav li:nth-child(4) a { animation: entrance-nav 480ms cubic-bezier(.16,1,.3,1) 265ms both; }

    html.motion-pending .time-panel {
      animation: entrance-nav 520ms cubic-bezier(.16,1,.3,1) 180ms both;
    }

    html.motion-pending .sign-up {
      animation: entrance-action 520ms cubic-bezier(.16,1,.3,1) 220ms both;
    }

    html.motion-pending .menu-toggle {
      animation: entrance-action 520ms cubic-bezier(.16,1,.3,1) 140ms both;
    }

    html.motion-pending .line-one .line-reveal {
      animation: entrance-line 800ms cubic-bezier(.22,1,.36,1) 300ms both;
    }

    html.motion-pending .line-two .line-reveal {
      animation: entrance-line 850ms cubic-bezier(.22,1,.36,1) 440ms both;
    }

    html.motion-pending .hero-copy {
      animation: entrance-copy 620ms cubic-bezier(.16,1,.3,1) 740ms both;
    }

    html.motion-pending .primary-cta {
      animation: entrance-action 560ms cubic-bezier(.16,1,.3,1) 960ms both;
    }

    html.motion-pending .demo-card {
      animation: entrance-card 920ms cubic-bezier(.22,1,.36,1) 1040ms both;
      transform-origin: 82% 50%;
    }

    /* Focus Visible */
    button:focus-visible, a:focus-visible {
      outline: 2px solid #ffffff;
      outline-offset: 3px;
    }

    /* RESPONSIVE OVERRIDES */
    /* Tablet */
    @media (min-width: 620px) and (max-width: 790px), (min-width: 620px) and (max-width: 1100px) and (orientation: portrait) {
      .menu-toggle {
        display: flex;
      }
      .header-actions {
        display: none;
        position: absolute;
        top: 54px;
        right: 0;
        width: min(324px, calc(100vw - 2 * var(--gutter-start)));
        background: linear-gradient(145deg, rgba(24,22,20,.94), rgba(5,12,14,.96));
        border: 1px solid rgba(255,255,255,.16);
        border-radius: 16px;
        backdrop-filter: blur(18px) saturate(108%);
        padding: 24px;
        flex-direction: column;
        gap: 20px;
        box-shadow: 0 10px 40px rgba(0,0,0,.8);
        opacity: 0;
        visibility: hidden;
        transform: translateY(-8px) scale(.985);
        transition: all 0.25s cubic-bezier(.16,1,.3,1);
      }
      .header.menu-open .header-actions {
        display: flex;
        opacity: 1;
        visibility: visible;
        transform: translateY(0) scale(1);
      }
      .header.menu-open .menu-toggle span:nth-child(1) {
        transform: translateY(3.5px) rotate(45deg);
      }
      .header.menu-open .menu-toggle span:nth-child(2) {
        transform: translateY(-3.5px) rotate(-45deg);
      }
      .nav {
        margin-left: 0;
        flex-direction: column;
        gap: 16px;
        top: 0;
      }
      .time-panel {
        margin-left: 0;
        width: 100%;
        border-left: none;
        border-top: 1px solid rgba(255,255,255,.1);
        padding-top: 12px;
        padding-left: 0;
      }
      .sign-up {
        margin-left: 0;
        width: 100%;
      }
    }

    /* Mobile */
    @media (max-width: 619px) {
      .menu-toggle {
        display: flex;
      }
      .header-actions {
        display: none;
        position: absolute;
        top: 54px;
        right: 0;
        width: min(340px, calc(100vw - 32px));
        background: linear-gradient(145deg, rgba(24,22,20,.95), rgba(5,12,14,.98));
        border: 1px solid rgba(255,255,255,.16);
        border-radius: 16px;
        backdrop-filter: blur(18px) saturate(108%);
        padding: 24px;
        flex-direction: column;
        gap: 20px;
        box-shadow: 0 10px 40px rgba(0,0,0,.85);
      }
      .header.menu-open .header-actions {
        display: flex;
      }
      .nav {
        margin-left: 0;
        flex-direction: column;
        gap: 16px;
        top: 0;
      }
      .time-panel {
        margin-left: 0;
        width: 100%;
        border-left: none;
        border-top: 1px solid rgba(255,255,255,.1);
        padding-top: 12px;
        padding-left: 0;
      }
      .sign-up {
        margin-left: 0;
        width: 100%;
      }
      .hero-title .line-one { transform: scaleX(0.78); }
      .hero-title .line-two { transform: scaleX(0.55); }
      .hero-copy br { display: none; }
      .hero-copy { width: 88vw; font-size: 13px; }
      .demo-card {
        top: clamp(176px, 32svh, 300px);
        bottom: auto;
        right: var(--gutter-start);
        width: clamp(120px, 16vh, 160px);
      }
    }
  </style>
</head>
<body>
  <main class="viewport">
    <section class="screen" id="screen">
      <!-- Full-Bleed Video Background -->
      <video class="background" autoplay muted loop playsinline disablepictureinpicture aria-hidden="true">
        <source src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260808_064556_051587f1-74a1-4336-8c05-4dde3594ed05.mp4" type="video/mp4">
      </video>

      <!-- Header Bar -->
      <header class="header" id="header">
        <!-- 25x25 SVG Disc Brand Logo -->
        <a href="/" class="brand" aria-label="Kubra home">
          <svg viewBox="0 0 25 25" fill="none" xmlns="http://www.w3.org/2000/svg">
            <g clip-path="url(#discClip)">
              <circle cx="12.5" cy="12.5" r="12.5" fill="#ededed"/>
              <path d="M12.5 0L25 12.5L12.5 25L0 12.5Z" fill="#050606"/>
              <path d="M12.5 3.5L21.5 12.5L12.5 21.5L3.5 12.5Z" fill="#737778"/>
              <path d="M12.5 6.5L18.5 12.5L12.5 18.5L6.5 12.5Z" fill="#fafafa"/>
              <path d="M12.5 9L16 12.5L12.5 16L9 12.5Z" fill="#0a0b0b"/>
            </g>
            <defs>
              <clipPath id="discClip">
                <circle cx="12.5" cy="12.5" r="12.5"/>
              </clipPath>
            </defs>
          </svg>
        </a>

        <!-- Header Actions: Nav + Time + Sign Up -->
        <div class="header-actions" id="tablet-navigation">
          <nav class="nav" aria-label="Main Navigation">
            <li><a href="#home">Home</a></li>
            <li><a href="#about">About</a></li>
            <li><a href="#services">Services</a></li>
            <li><a href="#contact">Contact</a></li>
          </nav>

          <div class="time-panel">
            <span class="time-panel__label">Timezone</span>
            <span class="time-panel__value">9:47 PM&nbsp; • &nbsp;14 July 2026</span>
          </div>

          <button class="sign-up" type="button">Sign Up</button>
        </div>

        <!-- Mobile/Tablet Hamburger Toggle -->
        <button class="menu-toggle" id="menuToggle" aria-label="Toggle navigation menu" aria-expanded="false">
          <span></span>
          <span></span>
        </button>
      </header>

      <!-- Center Matter.js Gravity Text Interactive Zone -->
      <div id="matter-container" style="position: absolute; top: 18dvh; left: 50%; transform: translateX(-50%); width: min(85vw, 900px); height: 42dvh; z-index: 4; pointer-events: auto; cursor: grab;">
        <canvas id="matter-canvas" style="width: 100%; height: 100%; display: block;"></canvas>
      </div>

      <!-- Bottom-Left Hero Section -->
      <section class="hero">
        <div class="hero-content">
          <h1 class="hero-title">
            <span class="line line-one">
              <span class="line-reveal">Stop Digging</span>
            </span>
            <span class="line line-two">
              <span class="line-reveal">Through Dashboards.</span>
            </span>
          </h1>

          <p class="hero-copy">
            Your metrics are scattered across a dozen dashboards.<br>
            Vantage bring them into one clear signal, so every<br>
            decision is backed by data you actually trust.
          </p>

          <button class="primary-cta" type="button" aria-label="Get Started" onclick="window.location.href='/'">
            <span class="label">Get Started</span>
            <span class="arrow-box">
              <svg viewBox="0 0 14 14">
                <path d="M3 7h8M7 3l4 4-4 4" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </span>
          </button>
        </div>

        <!-- Bottom-Right Glass Demo Card -->
        <article class="demo-card" id="demoCard">
          <div class="demo-visual">
            <img
              src="https://images.unsplash.com/photo-1550684848-fac1c5b4e853?w=500&auto=format&fit=crop&q=80"
              alt="Abstract red and blue smoke"
            >
            <button class="play-btn" type="button" aria-label="Play demo" onclick="window.location.href='/'">
              <svg viewBox="0 0 24 24">
                <polygon points="6,3 20,12 6,21"/>
              </svg>
            </button>
          </div>

          <button class="watch-button" type="button" onclick="window.location.href='/'">Watch Demo</button>
        </article>
      </section>
    </section>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
  <script>
    (function () {
      'use strict';

      // 1. Remove motion-pending on demo card animation end
      var demoCard = document.getElementById('demoCard');
      if (demoCard) {
        demoCard.addEventListener('animationend', function () {
          document.documentElement.classList.remove('motion-pending');
          clearTimeout(fallbackTimeout);
        });
      }

      // 2. Mobile/Tablet Menu Toggle
      var menuToggle = document.getElementById('menuToggle');
      var header = document.getElementById('header');

      if (menuToggle && header) {
        menuToggle.addEventListener('click', function () {
          var isOpen = header.classList.toggle('menu-open');
          menuToggle.setAttribute('aria-expanded', isOpen);
        });

        // Close on Escape or Outside Click
        document.addEventListener('keydown', function (e) {
          if (e.key === 'Escape' && header.classList.contains('menu-open')) {
            header.classList.remove('menu-open');
            menuToggle.setAttribute('aria-expanded', 'false');
          }
        });

        document.addEventListener('pointerdown', function (e) {
          if (header.classList.contains('menu-open') && !header.contains(e.target)) {
            header.classList.remove('menu-open');
            menuToggle.setAttribute('aria-expanded', 'false');
          }
        });
      }

      // 3. Matter.js Falling Physics Text (React Bits Style)
      if (typeof Matter !== 'undefined') {
        var Engine = Matter.Engine,
            Render = Matter.Render,
            World = Matter.World,
            Bodies = Matter.Bodies,
            Runner = Matter.Runner,
            Mouse = Matter.Mouse,
            MouseConstraint = Matter.MouseConstraint;

        var container = document.getElementById('matter-container');
        var canvas = document.getElementById('matter-canvas');
        if (container && canvas) {
          var width = container.clientWidth || 800;
          var height = container.clientHeight || 350;

          var engine = Engine.create({
            gravity: { x: 0, y: 0.75, scale: 0.001 }
          });
          var world = engine.world;

          var render = Render.create({
            canvas: canvas,
            engine: engine,
            options: {
              width: width,
              height: height,
              background: 'transparent',
              wireframes: false
            }
          });

          Render.run(render);
          var runner = Runner.create();
          Runner.run(runner, engine);

          // Walls
          var wallOpts = { isStatic: true, render: { visible: false }, restitution: 0.7 };
          var ground = Bodies.rectangle(width / 2, height + 20, width * 2, 40, wallOpts);
          var leftWall = Bodies.rectangle(-20, height / 2, 40, height * 2, wallOpts);
          var rightWall = Bodies.rectangle(width + 20, height / 2, 40, height * 2, wallOpts);
          World.add(world, [ground, leftWall, rightWall]);

          // Items: K U B R A + Tags
          var items = [
            { text: 'K', bg: '#ffffff', color: '#101010', isMain: true, w: 72, h: 72, radius: 18, fontSize: 38 },
            { text: 'U', bg: '#ffffff', color: '#101010', isMain: true, w: 72, h: 72, radius: 18, fontSize: 38 },
            { text: 'B', bg: '#ffc5dc', color: '#831843', isMain: true, w: 72, h: 72, radius: 18, fontSize: 38 },
            { text: 'R', bg: '#fd86db', color: '#701a75', isMain: true, w: 72, h: 72, radius: 18, fontSize: 38 },
            { text: 'A', bg: '#f43f5e', color: '#ffffff', isMain: true, w: 72, h: 72, radius: 18, fontSize: 38 },
            { text: 'ONDC Core', bg: 'rgba(255,255,255,0.08)', color: '#60a5fa', isMain: false, w: 120, h: 36, radius: 18, fontSize: 13 },
            { text: 'Coordination', bg: 'rgba(245,158,11,0.15)', color: '#fbbf24', isMain: false, w: 130, h: 36, radius: 18, fontSize: 13 },
            { text: 'Voter Bloc', bg: 'rgba(16,185,129,0.15)', color: '#34d399', isMain: false, w: 110, h: 36, radius: 18, fontSize: 13 }
          ];

          var bodiesList = [];
          items.forEach(function (item, idx) {
            var x = width / 2 + (idx - items.length / 2) * 50 + (Math.random() - 0.5) * 30;
            var y = -40 - idx * 45;
            var body = Bodies.rectangle(x, y, item.w, item.h, {
              chamfer: { radius: item.radius },
              restitution: 0.8,
              friction: 0.1,
              angle: (Math.random() - 0.5) * 0.4,
              render: { visible: false }
            });
            bodiesList.push({ body: body, item: item });
            World.add(world, body);
          });

          // Mouse
          var mouse = Mouse.create(canvas);
          var mouseConstraint = MouseConstraint.create(engine, {
            mouse: mouse,
            constraint: { stiffness: 0.2, render: { visible: false } }
          });
          World.add(world, mouseConstraint);
          render.mouse = mouse;

          // Custom Render Loop for Sharp Text
          var ctx = canvas.getContext('2d');
          function drawLoop() {
            if (ctx) {
              ctx.clearRect(0, 0, width, height);
              bodiesList.forEach(function (entry) {
                var b = entry.body;
                var itm = entry.item;
                ctx.save();
                ctx.translate(b.position.x, b.position.y);
                ctx.rotate(b.angle);

                ctx.beginPath();
                ctx.roundRect(-itm.w / 2, -itm.h / 2, itm.w, itm.h, itm.radius);
                ctx.fillStyle = itm.bg;
                ctx.fill();

                if (!itm.isMain) {
                  ctx.lineWidth = 1;
                  ctx.strokeStyle = itm.color;
                  ctx.stroke();
                } else {
                  ctx.shadowColor = 'rgba(0,0,0,0.5)';
                  ctx.shadowBlur = 8;
                  ctx.shadowOffsetY = 2;
                }

                ctx.fillStyle = itm.color;
                ctx.font = (itm.isMain ? '900 ' : '600 ') + itm.fontSize + 'px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(itm.text, 0, 1);
                ctx.restore();
              });
            }
            requestAnimationFrame(drawLoop);
          }
          drawLoop();

          window.addEventListener('resize', function () {
            if (!container) return;
            var newW = container.clientWidth;
            var newH = container.clientHeight;
            render.canvas.width = newW;
            render.canvas.height = newH;
            Matter.Body.setPosition(ground, { x: newW / 2, y: newH + 20 });
            Matter.Body.setPosition(rightWall, { x: newW + 20, y: newH / 2 });
          });
        }
      }
    })();
  </script>
</body>
</html>
